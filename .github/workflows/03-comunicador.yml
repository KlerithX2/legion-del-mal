name: Comunicador de la Legion

on:
  workflow_dispatch:
    inputs:
        villano:
            description: '¿Qué villano envía el mensaje?'
            required: true
            type: choice
            options:
                - Deathstroke
                - Joker
                - Brainiac
                - Lex Luthor

        mensaje: 
          description: "Mensaje a transmitir"
          required: true
          type: string
          default: "La misión fue un éxito"

        cow_character:
          description: "Personaje"
          required: true
          type: choice
          options:
              - eyes
              - tux
              - dragon
              - ghostbusters
              - king

        prioridad:
          description: "Nivel de prioridad"
          required: true
          type: choice
          options:
              - Alta
              - Media
              - Baja

jobs: 
    transmitir_mensaje:
        runs-on: ubuntu-latest

        steps:

          - name: Instalar el transmisor de la Legión
            run: sudo apt-get install -y cowsay


          - name: Imprimir inputs
            run: |
              echo "================================"
              echo "Transmisión de mensaje de la Legión del Mal"
              echo "================================"
              echo "De: ${{ github.event.inputs.villano }}"
              echo "Mensaje: ${{ github.event.inputs.mensaje }}"
              echo "Prioridad: ${{ github.event.inputs.prioridad }}"
              echo "Fecha: $(date -u + "%d/%m/%Y %H:%M:%S UTC")"
              echo "------- Mensaje --------------------------"
              cowsay cow_character="${{ github.event.inputs.cow_character }}" "${{ github.event.inputs.mensaje }}"
              echo " "
              echo "..."